<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KWC Practice</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app-container">

        <!-- Home screen -->
        <section id="home-screen" class="screen active">

            <header class="app-header">
                <p class="eyebrow">Kendama World Cup 2026</p>
                <h1>Practice Runs</h1>

                <p class="intro">
                    Choose a format to begin building your
                    practice run(s).
                </p>
            </header>

            <div class="mode-grid">

                <button
                    class="mode-card"
                    type="button"
                    data-mode="preliminary"
                >
                    <span class="mode-label">Preliminary</span>

                    <span class="mode-title">
                        Preliminary Round Practice
                    </span>

                    <span class="mode-description">
                        Select 10 tricks for two three-minute rounds with 5 tricks per round (no repeated tricks allowed).
                    </span>
                </button>

                <button
                    class="mode-card"
                    type="button"
                    data-mode="finals"
                >
                    <span class="mode-label">Finals</span>

                    <span class="mode-title">
                        Finals Practice
                    </span>

                    <span class="mode-description">
                        Select between 10 and 30 tricks for a
                        three-minute round.
                    </span>
                </button>

            </div>
        </section>


        <!-- Trick selection screen -->
        <section id="selection-screen" class="screen">

            <button
                id="back-home-button"
                class="text-button"
                type="button"
            >
                ← Back
            </button>

            <header class="selection-header">
                <p class="eyebrow">Practice Mode</p>

                <h2 id="selection-title">
                    Select Tricks
                </h2>

                <p id="selection-description"></p>
            </header>

            <div class="selection-status">
                <p id="selection-counter">
                    Selected:
                    <strong id="selected-count">0</strong>
                </p>

                <button
                    id="start-practice-button"
                    class="primary-button"
                    type="button"
                    disabled
                >
                    Start Practice
                </button>
            </div>

            <div class="table-container">
                <table class="trick-table">
                    <thead>
                        <tr>
                            <th>Select</th>
                            <th>Level</th>
                            <th>#</th>
                            <th>Trick Name</th>
                            <th>Points</th>
                        </tr>
                    </thead>

                    <tbody id="trick-table-body">
                    <!-- JavaScript will insert tricks here -->
                    </tbody>
                </table>
            </div>

            <p id="table-message" class="table-message"></p>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
